# Builds output/resume.pdf, rasterizes it to docs/resume-preview.png, and commits
# the PNG when it changes. Commit message includes [skip ci] to avoid workflow loops.

name: Resume README preview

on:
  push:
    branches: [main]
    paths:
      - "resume.tex"
      - "Makefile"
      - ".github/workflows/resume-readme-preview.yml"
      - "scripts/export_resume_png.py"
      - "scripts/requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install and verify Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip check
          python -c "from PIL import Image; import PIL; print('Pillow', PIL.__version__)"

      - name: Build PDF
        run: make

      - name: Export PNG for README
        run: python scripts/export_resume_png.py

      - name: Commit and push if PNG changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/resume-preview.png
          if git diff --staged --quiet; then
            echo "No changes to resume preview PNG."
          else
            git commit -m "chore: refresh resume README preview [skip ci]"
            git push
          fi
